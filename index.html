<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Cam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cam"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="cam-icon-180.png">
<style>
:root{box-sizing:border-box;background:#000;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
html,body{height:100%;margin:0;background:#000}
body{display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cam{width:min(94vw,440px);box-sizing:border-box;padding:14px;border-radius:26px;background:linear-gradient(160deg,#dfe2e6,#a4a9b0 55%,#80858d);box-shadow:0 0 0 1px #5b6068,0 16px 36px rgba(0,0,0,.6),inset 0 2px 2px #fff,inset 0 -3px 6px rgba(0,0,0,.25)}
.lcd{position:relative;flex:none;width:100%;aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px #1c1e22,0 0 0 4px #5b6068}
canvas{width:100%;height:100%;display:block}
#v{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hud{position:absolute;inset:0;pointer-events:none;color:#fff;font:700 13px "Courier New",monospace;text-shadow:0 0 3px #000,1px 1px 0 #000}
.hud>*{position:absolute}
#st{left:10px;top:8px}#st.r{color:#ff3b30;animation:bl 1s steps(2) infinite}
.sp{left:50%;top:8px;transform:translateX(-50%)}
.bat{right:10px;top:8px;width:26px;height:12px;border:2px solid #fff;border-radius:2px;display:flex;gap:2px;padding:1px;box-sizing:content-box}
.bat i{flex:1;background:#fff}
#tc{right:10px;top:30px}
@keyframes bl{50%{opacity:0}}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:12px;font-size:14px}
.ov video{max-width:100%;max-height:68%;background:#000}
.rb{display:flex;gap:10px}
.hide{display:none!important}
.b{border:1px solid #5b6068;border-radius:16px;padding:9px 16px;background:linear-gradient(#fff,#cfd3d9);font:700 14px -apple-system,Helvetica,Arial,sans-serif;color:#223}
.b.blue{background:linear-gradient(#86b9f7,#2f7de1);color:#fff;border-color:#1f5db0}
.b:active{filter:brightness(.78)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 6px}
.mdv{background:#16181c;color:#e8eaee;font:italic 700 12px Arial,sans-serif;padding:5px 10px;border-radius:4px;letter-spacing:.5px;box-shadow:inset 0 1px 2px rgba(255,255,255,.2)}
.lbl{font:700 10px Arial,sans-serif;color:#3a3d44;text-align:center;line-height:1.3}
#rec{width:76px;height:76px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 50% 30%,#eceef1,#8b9098);box-shadow:inset 0 2px 3px #fff,0 2px 5px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
#rec span{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff9a90,#e5251f 55%,#8c0c0a);box-shadow:inset 0 -3px 5px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.5)}
#rec:active span{filter:brightness(.7)}
#rec.on span{animation:pu 1s infinite}
@keyframes pu{50%{opacity:.5}}
.zm{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:54%;display:flex;flex-direction:column;gap:6px;pointer-events:none;color:#fff;font:700 11px "Courier New",monospace;text-shadow:0 0 3px #000,1px 1px 0 #000}
.zi{display:flex;align-items:center;gap:6px}
.zb{flex:1;height:6px;border:1px solid #fff;background:rgba(0,0,0,.35);position:relative}
#zf{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
#zr{position:relative;height:28px;border-radius:14px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.65);touch-action:none;pointer-events:auto}
#zr .l,#zr .r{position:absolute;top:6px}#zr .l{left:10px}#zr .r{right:10px}
#zt{position:absolute;top:2px;left:calc(50% - 11px);width:22px;height:22px;border-radius:11px;background:linear-gradient(#fff,#b9bec7);box-shadow:0 1px 3px rgba(0,0,0,.6)}
@media (orientation:landscape){
.cam{display:flex;align-items:center;gap:14px;width:auto;max-width:calc(100% - 16px);height:min(calc(100% - 8px),340px);padding:12px 16px 12px 12px}
.lcd{height:100%;width:auto}
.ctl{flex-direction:column;margin:0;padding:0;gap:14px;height:100%;justify-content:center}
#rec{width:68px;height:68px}#rec span{width:48px;height:48px}
}
</style></head><body>
<div class="cam"><div class="lcd"><canvas id="cv" width="640" height="480"></canvas>
<div class="hud"><span id="st">STBY</span><span class="sp">SP</span><span class="bat"><i></i><i></i><i></i></span><span id="tc">0:00:00</span></div>
<div class="zm"><div class="zi"><span>W</span><div class="zb"><i id="zf"></i></div><span>T</span></div><div id="zr"><span class="l">W</span><span class="r">T</span><b id="zt"></b></div></div>
<div class="ov" id="start"><button class="b blue" id="go">Tap to start camera</button><div id="msg"></div></div>
<div class="ov hide" id="rev"><video id="rv" controls playsinline></video><div class="rb"><button class="b blue" id="sv">Save to Photos</button><button class="b" id="dl">Discard</button></div></div>
</div>
<div class="ctl"><div class="mdv">MiniDV</div><button id="rec" aria-label="Record"><span></span></button><div class="lbl">START<br>STOP</div></div></div>
<video id="v" playsinline muted autoplay></video>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),x=cv.getContext('2d'),v=$('#v'),W=640,H=480;
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c};
const small=mk(320,240,()=>{}),sg=small.getContext('2d');
const grain=mk(160,160,(g,w,h)=>{const d=g.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=Math.random()*255;d.data[i+3]=255}g.putImageData(d,0,0)});
const gp=x.createPattern(grain,'repeat'),sp=x.createPattern(mk(4,2,g=>{g.fillStyle='rgba(0,0,0,.30)';g.fillRect(0,0,4,1)}),'repeat');
const MO=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],p2=n=>String(n).padStart(2,'0');
let stream,rec,chunks=[],t0=0,on=0,blob=null,url=null,looping=0,rt=0;
let zm=1,lz=0,zv=0,zu=0,zl=performance.now();
function zoomStep(){const n=performance.now(),dt=Math.min(.05,(n-zl)/1000);zl=n;const u=Math.abs(zu)<.08?0:zu,want=Math.sign(u)*Math.pow(Math.abs(u),1.5)*.9;zv+=(want-zv)*Math.min(1,dt*5);lz=Math.max(0,Math.min(Math.LN10,lz+zv*dt));if((lz<=0&&zv<0)||(lz>=Math.LN10&&zv>0))zv=0;zm=Math.exp(lz);$('#zf').style.width=(lz/Math.LN10*100)+'%'}
function draw(){
zoomStep();
if(v.paused&&stream&&!document.hidden&&!rt){rt=1;v.play().catch(()=>{}).then(()=>setTimeout(()=>rt=0,400))}
if(v.readyState>=2&&v.videoWidth){const vw=v.videoWidth,vh=v.videoHeight;let cw=vw,ch=vw*.75;if(ch>vh){ch=vh;cw=vh/.75}
cw/=zm;ch/=zm;sg.drawImage(v,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,320,240);
x.globalCompositeOperation='source-over';x.globalAlpha=1;x.imageSmoothingEnabled=true;x.drawImage(small,0,0,W,H);
x.globalCompositeOperation='multiply';x.fillStyle='rgb(255,244,222)';x.fillRect(0,0,W,H);
x.globalCompositeOperation='screen';x.fillStyle='rgba(26,36,64,.12)';x.fillRect(0,0,W,H);
x.globalCompositeOperation='overlay';x.globalAlpha=.16;x.save();x.translate(-Math.random()*160,-Math.random()*160);x.fillStyle=gp;x.fillRect(0,0,W+160,H+160);x.restore();
x.globalCompositeOperation='source-over';x.globalAlpha=1;
const d=new Date();let h=d.getHours();const ap=h<12?'AM':'PM';h=h%12||12;
const s=`${MO[d.getMonth()]} ${d.getDate()} ${d.getFullYear()}  ${h}:${p2(d.getMinutes())}:${p2(d.getSeconds())} ${ap}`;
x.font='bold 26px "Courier New",monospace';x.lineWidth=4;x.strokeStyle='rgba(0,0,0,.8)';x.strokeText(s,20,H-22);x.fillStyle='#ffab4a';x.fillText(s,20,H-22);
x.fillStyle=sp;x.fillRect(0,0,W,H)}
requestAnimationFrame(draw)}
$('#go').onclick=async()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:true});v.srcObject=stream;stream.getVideoTracks()[0].onended=()=>{$('#start').classList.remove('hide');$('#go').textContent='Tap to restart camera'};await v.play();$('#start').classList.add('hide');try{await navigator.wakeLock.request('screen')}catch(e){}if(!looping){looping=1;draw()}}catch(e){$('#msg').textContent='Camera or microphone access was blocked. Allow both for this app, then try again.'}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stream&&!on&&stream.getVideoTracks()[0].readyState==='ended'){$('#start').classList.remove('hide');$('#go').textContent='Tap to restart camera'}});
function resume(){const t=stream&&stream.getVideoTracks()[0];if(!t||t.readyState!=='live'){$('#start').classList.remove('hide');$('#go').textContent='Tap to restart camera';return}v.play().catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stream&&!on)resume()});
function ui(){$('#st').textContent=on?'● REC':'STBY';$('#st').classList.toggle('r',!!on);$('#rec').classList.toggle('on',!!on);if(!on)$('#tc').textContent='0:00:00'}
setInterval(()=>{if(on){const s=Math.floor((Date.now()-t0)/1000);$('#tc').textContent=`${Math.floor(s/3600)}:${p2(Math.floor(s/60)%60)}:${p2(s%60)}`}},250);
$('#rec').onclick=()=>{if(!stream)return;on?stop():start()};
function start(){if(!cv.captureStream||!window.MediaRecorder)return alert('Recording is not supported in this browser.');
const at=stream.getAudioTracks()[0],ms=new MediaStream([...cv.captureStream(30).getVideoTracks(),...(at?[at]:[])]);
const mt=['video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
chunks=[];rec=new MediaRecorder(ms,mt?{mimeType:mt,videoBitsPerSecond:2500000}:{});
rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
rec.onstop=()=>{blob=new Blob(chunks,{type:rec.mimeType||'video/mp4'});url=URL.createObjectURL(blob);$('#rv').src=url;$('#rev').classList.remove('hide')};
rec.start();on=1;t0=Date.now();ui()}
function stop(){on=0;rec.stop();ui()}
function closeRev(){const r=$('#rv');r.pause();r.removeAttribute('src');r.load();if(url)URL.revokeObjectURL(url);url=null;blob=null;$('#rev').classList.add('hide');resume()}
$('#dl').onclick=()=>{if(confirm('Discard this clip?'))closeRev()};
$('#sv').onclick=async()=>{if(!blob)return;const ext=/mp4/.test(blob.type)?'mp4':'webm',f=new File([blob],`Cam-${Date.now()}.${ext}`,{type:blob.type});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});closeRev()}else alert('Press and hold the video, then choose Save.')}catch(e){}};
const zr=$('#zr'),zt=$('#zt');
function zset(e){const r=zr.getBoundingClientRect(),hw=(r.width-22)/2;zu=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/hw));zt.style.transform=`translateX(${zu*hw}px)`}
const zend=()=>{zu=0;zt.style.transition='transform .18s ease-out';zt.style.transform='translateX(0)'};
zr.addEventListener('pointerdown',e=>{zr.setPointerCapture(e.pointerId);zt.style.transition='none';zset(e)});
zr.addEventListener('pointermove',e=>{if(zr.hasPointerCapture(e.pointerId))zset(e)});
zr.addEventListener('pointerup',zend);zr.addEventListener('pointercancel',zend);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
